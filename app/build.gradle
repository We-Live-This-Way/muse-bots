// Top-level build file. The canonical Gradle project — on a normal machine
// `gradle assembleDebug` builds the same app. In this VM the Gradle daemon
// cannot run (loopback TCP is intercepted by the runtime sandbox), so the
// real build here is build-apk-manual.sh, which uses the SDK command-line
// tools only. Keep the two in sync.
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
}
